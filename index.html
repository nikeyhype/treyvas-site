let PST=0,PPLAY=0;
function pieStep(){return PST}
function pieTick(){

 s.querySelectorAll("li[data-s]").forEach(e=>{const n=+e.dataset.s;e.classList.toggle("on",n<=st);e.classList.toggle("cur",n===st)});

}
function pieGo(n,keep){PST=Math.max(0,Math.min(PIE.length-1,n));if(!keep)pieStop();pieTick()}

document.addEventListener("click",e=>{const b=e.target.closest(".pb[data-st]");if(b)pieGo(pieStep()+ +b.dataset.st);if(e.target.closest("#pplay"))piePlay();const li=e.target.closest(".steps-l li[data-s]");if(li)pieGo(+li.dataset.s)});
document.addEventListener("input",e=>{if(e.target.id==="pstep")pieGo(+e.target.value)});
addEventListener("scroll",pieTick,{passive:true});addEventListener("resize",pieTick);
