<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Заречная 35 — живой тур</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;500;600&display=swap">
<style>
html,body{margin:0;height:100%;background:#0d0b09;color:#f3ead9;font-family:Manrope,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;z-index:3}
.b{background:rgba(23,19,15,.7);color:#f3ead9;border:1px solid rgba(230,198,146,.5);font:600 11px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px)}
.b[aria-pressed=true]{background:#c49a62;color:#17130f}.sp{flex:1}
.card{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100% - 28px));background:rgba(23,19,15,.82);padding:16px 18px;display:grid;gap:5px;border-left:3px solid #c49a62;backdrop-filter:blur(8px);z-index:3;transition:opacity .6s,transform .6s}
.card.off{opacity:0;transform:translateY(12px)}
.card i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#e6c692}.card b{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(24px,5vw,32px);line-height:1.1}.card span{font-size:14px;color:#e6c692}.card em{font-style:normal;font-size:14px;color:#ddd3c3;line-height:1.45}.card span:empty,.card em:empty{display:none}
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;z-index:3;padding:0 14px}
.dots{display:flex;gap:5px;flex:1;max-width:420px}.dots u{flex:1;height:3px;background:rgba(243,234,217,.25);overflow:hidden}.dots u s{display:block;height:100%;width:0;background:#c49a62}
.start,.end{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;background:rgba(13,11,9,.55);z-index:5;padding:24px}
.start h1,.end h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(36px,8vw,64px);margin:0}.start p,.end p{margin:0;color:#ddd3c3;max-width:34ch;line-height:1.5}
.go{background:#c49a62;color:#17130f;border:0;font:600 13px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:16px 26px;cursor:pointer;text-decoration:none}
[hidden]{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><a class="b" href="/dom-z35/">✕ К дому</a><span class="sp"></span><button class="b" id="mus" aria-pressed="false">♪ Музыка</button></div>
<div class="card off" id="card"><i></i><b></b><span></span><em></em></div>
<div class="nav" id="nav" hidden><button class="b" id="prev" aria-label="Назад">←</button><div class="dots" id="dots"></div><button class="b" id="pause" aria-label="Пауза">❚❚</button><button class="b" id="next" aria-label="Дальше">→</button></div>
<div class="start" id="start"><p style="letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#e6c692">Agalarov Estate · Заречная 35</p><h1>Живой тур по дому</h1><p>Реальные фотографии готового дома в объёме. Ведите пальцем или мышью, чтобы осмотреться.</p><button class="go" id="go">▶ Начать</button></div>
<div class="end" id="end" hidden><h1>Заречная 35</h1><p>1 465 м² · 30 соток у гольф-поля · дом готов</p><a class="go" href="/zayavka/">Записаться на показ</a><button class="b" id="again">Смотреть ещё раз</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SC=[["696353","Гостиная с камином","99,60","Гостиная, столовая и кухня — одно пространство с окнами в сад",1],
["696344","Столовая","","Большой стол для всей семьи у панорамного окна",1],
["696418","Кухня","","Остров в гостиной, а за ним отдельная рабочая кухня",1],
["696367","Бассейн","136,89","Бассейн в одном крыле с домом, окна в пол",1],
["696357","Сауна","10,62","Сауна с окном на бассейн",1],
["696319","Главная лестница","","Мраморная лестница под зенитным фонарём",1],
["696379","Холл второго этажа","45,27","Библиотека и зона отдыха у второго света",2],
["696394","Главная спальня","40,23","Спальня со своим гардеробом и ванной",2],
["696403","Главный гардероб","28,06","Гардеробная с островом и выходом на террасу",2],
["696395","Главная ванная","22,58","Отдельно стоящая ванна у окна в лес",2]];
const T=THREE,cv=document.getElementById("c"),R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.autoClear=false;
const cam=new T.PerspectiveCamera(50,1,.05,50),TL=new T.TextureLoader(),HFOV=68*Math.PI/180,tanH=Math.tan(HFOV/2),ASP=1.5,tanV=tanH/ASP;
const VS=`uniform sampler2D dm;uniform vec2 tn;varying vec2 vUv;void main(){vUv=uv;float d=texture2D(dm,uv).r;float z=4.2/(1.0+3.2*d);vec3 p=vec3((uv.x*2.0-1.0)*tn.x,(uv.y*2.0-1.0)*tn.y,-1.0)*z;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`;
const FS=`uniform sampler2D im;uniform float op;varying vec2 vUv;void main(){vec4 c=texture2D(im,vUv);gl_FragColor=vec4(c.rgb,op);}`;
const geo=new T.PlaneGeometry(1,1,220,146);
function mk(i){const s=SC[i];if(s.m)return s.m;const im=TL.load("/img/live/z35/"+s[0]+".jpg"),dm=TL.load("z35/"+s[0]+"d.jpg");im.minFilter=T.LinearFilter;dm.minFilter=T.LinearFilter;
 const m=new T.Mesh(geo,new T.ShaderMaterial({uniforms:{im:{value:im},dm:{value:dm},tn:{value:new T.Vector2(tanH,tanV)},op:{value:1}},vertexShader:VS,fragmentShader:FS,transparent:true}));m.frustumCulled=false;const sc=new T.Scene();sc.add(m);s.m=m;s.sc=sc;return m}
let cur=-1,prev=-1,t0=0,fade=0,paused=false,run=false,DUR=8000,ux=0,uy=0,pd=null,pauseAt=0;
const card=document.getElementById("card"),dots=document.getElementById("dots");dots.innerHTML=SC.map(()=>"<u><s></s></u>").join("");
function show(i){if(i>=SC.length){finish();return}if(i<0)i=0;prev=cur;cur=i;mk(i);if(i+1<SC.length)mk(i+1);t0=performance.now();fade=t0;ux=uy=0;
 card.classList.add("off");setTimeout(()=>{const s=SC[i];card.querySelector("i").textContent=String(i+1).padStart(2,"0")+" / "+String(SC.length).padStart(2,"0")+" · "+s[4]+" этаж";card.querySelector("b").textContent=s[1];card.querySelector("span").textContent=s[2]?s[2]+" м²":"";card.querySelector("em").textContent=s[3];card.classList.remove("off")},500);
 [...dots.children].forEach((u,k)=>u.firstChild.style.width=k<i?"100%":"0")}
function finish(){run=false;document.getElementById("end").hidden=false;document.getElementById("nav").hidden=true;card.classList.add("off");musStop()}
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;const a=w/h;let tv=tanV*.76;if(a*tv>tanH*.8)tv=tanH*.8/a;cam.fov=2*Math.atan(tv)*180/Math.PI;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();
function setCam(k,i){const a=cam.aspect,th=Math.tan(cam.fov*Math.PI/360)*a,spare=Math.max(0,Math.atan(tanH)-Math.atan(th))*.85,dir=i%2?-1:1,e=k*k*(3-2*k);
 const yaw=-dir*spare*(e*2-1)+ux,sx=dir*(-.1+.2*e);
 cam.position.set(sx-ux*.35,.03*Math.sin(k*Math.PI)+uy*.3,.12-.5*e);cam.rotation.set(uy*.25,Math.max(-spare-.05,Math.min(spare+.05,yaw)),0,"YXZ")}
function frame(){requestAnimationFrame(frame);const now=performance.now();if(cur<0)return;
 const el=(paused?pauseAt:now)-t0,k=Math.min(1,el/DUR);
 R.clear();const f=Math.min(1,(now-fade)/1100);
 if(prev>=0&&f<1){const p=SC[prev];setCam(1,prev);cam.position.z-=.25*f;p.m.material.uniforms.op.value=1;R.render(p.sc,cam);R.clearDepth()}
 const s=SC[cur];setCam(k,cur);s.m.material.uniforms.op.value=prev>=0?f:1;R.render(s.sc,cam);
 if(run){dots.children[cur].firstChild.style.width=(k*100)+"%";if(k>=1&&!paused)show(cur+1)}}
cv.addEventListener("pointerdown",e=>{pd={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!pd)return;ux=Math.max(-.25,Math.min(.25,ux-(e.clientX-pd.x)/innerWidth*.6));uy=Math.max(-.2,Math.min(.2,uy+(e.clientY-pd.y)/innerHeight*.5));pd={x:e.clientX,y:e.clientY}});
addEventListener("pointerup",()=>pd=null);
addEventListener("mousemove",e=>{if(pd||matchMedia("(pointer:coarse)").matches)return;ux=-(e.clientX/innerWidth-.5)*.12;uy=(e.clientY/innerHeight-.5)*.08});
const $=id=>document.getElementById(id);
$("next").onclick=()=>{paused=false;$("pause").textContent="❚❚";show(cur+1)};$("prev").onclick=()=>{paused=false;$("pause").textContent="❚❚";show(cur-1)};
$("pause").onclick=()=>{if(!paused){paused=true;pauseAt=performance.now();$("pause").textContent="▶"}else{t0+=performance.now()-pauseAt;paused=false;$("pause").textContent="❚❚"}};
addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click();if(e.key===" ")$("pause").click()});
let AC=null,MG=null,mus=null,musOn=false;
function musStart(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();MG=AC.createGain();MG.gain.value=0;MG.gain.linearRampToValueAtTime(.16,AC.currentTime+2.5);const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1500;lp.connect(MG);MG.connect(AC.destination);
 const ch=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]];let i=0;
 const play=()=>{if(!MG)return;const t=AC.currentTime,c=ch[i++%4];c.forEach((f,j)=>["sine","triangle"].forEach((tp,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tp;o.frequency.value=f*(k?.5:1)*(1+(j-1.5)*.0015);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(k?.05:.035,t+1.6);g.gain.linearRampToValueAtTime(0,t+7.8);o.connect(g);g.connect(lp);o.start(t);o.stop(t+8)}))};play();mus=setInterval(play,6000)}catch(x){}}
function musStop(){clearInterval(mus);if(MG&&AC){const g=MG;g.gain.linearRampToValueAtTime(0,AC.currentTime+.8);setTimeout(()=>g.disconnect(),1000)}MG=null}
$("mus").onclick=()=>{musOn=!musOn;$("mus").setAttribute("aria-pressed",musOn);musOn?musStart():musStop()};
function begin(){$("start").hidden=true;$("end").hidden=true;$("nav").hidden=false;run=true;prev=cur=-1;if(!musOn){musOn=true;$("mus").setAttribute("aria-pressed",true);musStart()}show(0)}
$("go").onclick=begin;$("again").onclick=begin;
mk(0);cur=0;t0=performance.now();fade=0;frame();
</script></body></html>
